name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_PERSISTENT_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Reuse debug signing key for app updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: photosweep-debug-signing-key-v1

      - name: Restore permanent signing key when configured
        if: env.HAS_PERSISTENT_SIGNING_KEY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Duplio-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare private signing-key backup
        if: env.HAS_PERSISTENT_SIGNING_KEY == 'false'
        run: cp "$HOME/.android/debug.keystore" "$RUNNER_TEMP/debug.keystore"

      - name: Upload private signing-key backup once
        if: env.HAS_PERSISTENT_SIGNING_KEY == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: Duplio-SIGNING-KEY-PRIVATE
          path: ${{ runner.temp }}/debug.keystore
          if-no-files-found: error
          retention-days: 14

